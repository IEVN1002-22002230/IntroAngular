<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <div class="mb-3">
                    <form>
                        <div class="form-group pt-4">
                            <label for="num1">Número 1:</label>
                            <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese numero 1"/>
                        </div>

                        <div class="form-group pt-4">
                            <label for="num2">Número 2:</label>
                            <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese numero 2"/>
                        </div>

                        <br/>
                        <div class="form-check">
                            <input [(ngModel)]="operacion" name="operacion" type="radio" class="form-check-input" value="sumar" id="sumar"/>
                            <label class="form-check-label" for="sumar">
                                Sumar
                            </label>
                        </div>
                         <!--  <button (click)="sumar()" type="button" class="btn btn-primary">
                            Sumar
                        </button>
                        <br/>
                        <button (click)="multiplicar()" type="button" class="btn btn-primary">
                            Multiplicar
                        </button>
                        <br/>
                        <button (click)="restar()" type="button" class="btn btn-primary">
                            Restar
                        </button>
                        <br/>
                        <button (click)="dividir()" type="button" class="btn btn-primary">
                            Dividir
                        </button>
                         -->

                        <div class="form-check">
                            <input [(ngModel)]="operacion" name="operacion" type="radio" class="form-check-input" value="multiplicar" id="multiplicar"/>
                            <label class="form-check-label" for="multiplicar">
                                Multiplicar
                            </label>

                        </div>

                        <div class="form-check">
                            <input [(ngModel)]="operacion" name="operacion"  type="radio" class="form-check-input" value="restar" id="restar"/>
                            <label class="form-check-label" for="restar">
                                Restar
                            </label>

                        </div>

                        <div class="form-check">
                            <input [(ngModel)]="operacion" name="operacion" type="radio" class="form-check-input" value="dividir" id="dividir"/>
                            <label class="form-check-label" for="dividir">
                                Dividir
                            </label>

                        </div>

                        <br/>

                        <button (click)="calcular()"  type="button" class="btn btn-primary">Calcular</button>

                    </form>


                    <div class="col-6">
                        <h3>Resultado: {{resultado}}</h3>
                    </div>

                </div>

            </div>
        </div>
    </div>

</body>
</html>
