<div class="card">
    <div class="card-head">
        <h1>HEROES DRAGON BALL</h1>
        <!-- heroes html 11/09/26-->
        <!-- heroes html 18/09/26-->
         <div class="card-body">
            <div class="row">
                <div class="col-md-2">
                    Filtrar por:
                </div>
                <div class="col-md-4">
                    <input [(ngModel)]="listFilter" type="text" class="form-control" placeholder="Ingrese nombre del Heroe"><!--Enlace de dato bidireccional-->
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <h3>Filtro: {{listFilter}}</h3> 
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped" *ngIf="heroes.length>0"> <!-- ngIf para validar -->
                    <thead>
                        <tr>
                            <th><button (click)="showImage()" class="btn btn-primary">{{muestraImage?'Ocultar ': 'Muestra '}}<!--enlace de evento-->Imagen</button></th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Descripcion</th>
                            <th>Raza</th>
                            <th>KI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let heroe of heroes">
                            <td><img *ngIf="muestraImage" [src]="heroe.imagen"
                            [style.width.px]="imageWidth"
                            [style.margin.px]="muestraImage" /></td>
                            <td>{{heroe.nombre}}</td>
                            <td>{{heroe.descripcion}}</td>
                            <td>{{heroe.race}}</td>
                            <td>{{heroe.ki}}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
         </div>
    </div>
</div>
